services:
  - type: web
    name: nstconnect-backend
    runtime: node
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    env: node
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ANON_COOKIE_NAME
        value: sr_anonymous_id

  - type: web
    name: nstconnect-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    env: node
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
